<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Category Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 30px 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        label {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f4f6ff;
            border-left: 5px solid #667eea;
        }

        .result p {
            margin: 5px 0;
            font-size: 14px;
        }

        .highlight {
            font-weight: 500;
            color: #333;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: #999;
        }

    </style>
</head>

<body>

<div class="container">
    <h1>Category Predictor</h1>

    <form method="POST">

        <label>Description</label>
        <input type="text" name="description" placeholder="e.g. UPI payment to Amazon" required>

        <label>Withdrawal Amount</label>
        <input type="number" name="withdrawal" min="0" step="0.01" placeholder="0">

        <label>Deposit Amount</label>
        <input type="number" name="deposit" min="0"step="0.01" placeholder="0">

        <button type="submit">Predict Category</button>
    </form>

    {% if result %}
    <div class="result">
        <p><span class="highlight">Given:</span> {{ result['given_description'] }}</p>
        <p><span class="highlight">Processed:</span> {{ result['cleaned_description'] }}</p>
        <p><span class="highlight">Prediction:</span> {{ result['predicted_category'] }}</p>
    </div>
    {% endif %}

    <div class="footer">
        AI-Based Transaction Classification System
    </div>
</div>

</body>
</html>
